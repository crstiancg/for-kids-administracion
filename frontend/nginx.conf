server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos con hash en el nombre: se cachean un año (cambian de nombre
    # en cada build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El router está en modo history: cualquier ruta (/pos, /productos/12)
    # la resuelve la SPA. index.html sin caché para tomar cada deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
